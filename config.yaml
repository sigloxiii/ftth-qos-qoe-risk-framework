# ==============================================================================
# config.yaml - FTTH QoE Capstone | Methodology v3
# ==============================================================================
# PURPOSE OF THIS FILE
# ---------------------
# Single, machine-readable home of every parameter used by the pipeline.
# The rules and their justification live in docs/metrics_spec.md; the VALUES live
# here. Any change is made first in the spec (and its changelog), then here, in
# the same commit. Code (src/) never hardcodes a value that appears in this file.
#
# It exists to prevent the problems found in the v1/v2 audit:
#  v1: Convenience bias - only the first 1000 rows of each monthly file were read
#  v2: Instrument bias - legacy Whiteboxes (wnr3500l-high, wdr3600...) created
#      false latency/loss because they cannot forward at line rate
#  v2.1.3 -> v2.2: Loss was misinterpreted. `curr_udpcloss.packets` was treated
#      as loss %, then patched as `packets/10`. The FCC dictionary shows that file
#      records outage events, NOT per-test loss %. Real loss comes from
#      curr_udplatency: failures / (successes + failures)
#  v2: Inconsistent implementations - Python used timezone_offset while Power BI
#      used timezone_offset_dst; peak window 19-22:59 vs 19-23:59; different loss
#      sources. Totals matched but unit-by-unit reconciliation failed.
#  v2: Thresholds changed without justification (20 ms -> 50 ms latency).
#
# REQUIREMENTS
# ------------
#  Reading this file needs PyYAML (pip install pyyaml): yaml.safe_load(open(...))
#
# RELATED DOCS
# ------------
#  - docs/metrics_spec.md      -> Rules and justification (human-readable)
#  - docs/data_dictionary.md   -> What each column means; Step 0 verification results
#  - data/CSV_previews.md      -> First rows of the raw files (structure only; no FTTH units)
#  - config.local.yaml         -> Machine-specific paths (gitignored). Example:
#                                   inputs:
#                                     raw_dir: "D:/Capstone FTTH/data/raw/validated-data-sept2022"
#
# VERIFIED FACTS ABOUT THE DATA (Step 0, 258 FTTH units; see docs/data_dictionary.md)
# ----------------------------------------------------------------------------
#  - dtime is a string "%Y-%m-%d %H:%M:%S" with no time zone marker (not unix epoch)
#  - dtime behaves as each unit's LOCAL time, not UTC (step_7/step_8; decision D-03)
#  - timezone_offset_dst is in HOURS (values -4, -5, -7); all 258 units observe DST
#  - FTTH records span 2022-09-12 to 2022-10-31 (50 days), not only September
#  - Median RTT per unit is 2.5-17.2 ms; global loss is about 0.022%
#  - successes + failures ranges from 50 to 2,401 per row (step_9.py, check 6)
#  - Jitter unit is microseconds, supported indirectly: median jitter / rtt_std = 0.83,
#    Spearman 0.816 per unit (step_10.py); no FCC documentation states it
#
# DECISIONS MIRRORED HERE (docs/decisions.md): D-01 to D-05 and D-06 to D-10
#  D-06 one server per unit for all metrics | D-07 jitter minimum records
#  D-08 sensitivity grid | D-09 jitter stays in the rule, thresholds unchanged
#  D-10 episodic latency events (two descriptive columns)
# ==============================================================================

project:
  name: ftth-qoe-capstone
  methodology_version: "3.0"
  spec_version: "1.2.0"   # docs/metrics_spec.md version this file mirrors
  description: "Identify FTTH units at risk of poor QoE during local evening peak hours, using FCC MBA telemetry (Sept-Oct 2022), and separate real degradation from measurement artifacts"
  author: "Eng. Rafael Cansigno P. | Google Data Analytics Capstone"

# ------------------------------------------------------------------------------
# ANALYSIS PERIOD
# ------------------------------------------------------------------------------
# Full observed period (both ends inclusive, applied to dtime as stored).
# Rationale: September alone gives ~32 peak records per unit (P95 rests on ~1.6
# observations); the full period gives ~120 (about 6 observations).
analysis_period:
  start: "2022-09-12"
  end: "2022-10-31"

# ------------------------------------------------------------------------------
# POPULATION - Who is in scope
# ------------------------------------------------------------------------------
# Rationale: the Whitebox is the measurement instrument. A device that cannot
# forward at line rate creates the degradation it reports. The filter uses the
# nominal capability of each model, not a per-unit throughput test (see Limitations
# in docs/metrics_spec.md).
population:
  source_file: "data/unit-profile-sept2022.xlsx"   # FCC unit profile
  fiber_units_file: "data/fiber_units.csv"          # Derived: the 258 filtered units
  excluded_units_file: "data/excluded_legacy_ftth_units.csv"   # 27 legacy FTTH units (hardware not credible), kept for audit
  all_excluded_units_file: "data/excluded_legacy_units.csv"    # All Whiteboxes outside the analysis: non-fiber, or fiber not used
  allowed_whitebox_models: ["skwb8", "skwb8p", "ac1750v2"]
  excluded_models: ["wnr3500l-high", "wdr3600", "wr1043nd", "wr741nd", "wr741ndv4"]
  expected_counts:          # Verified against the unit profile; used by tests/
    total_ftth_raw: 285
    total_ftth_filtered: 258
    total_excluded: 27
    isps: { "Cincinnati Bell": 120, "Verizon": 76, "Frontier": 62 }
  allowed_timezone_offset_dst: [-4, -5, -7]   # Hours; any other value stops the pipeline

# ------------------------------------------------------------------------------
# INPUTS - Raw FCC files
# ------------------------------------------------------------------------------
# Raw data (6.8 GB) is NOT stored in the repo. Set the path in config.local.yaml.
inputs:
  raw_dir: null   # IMPORTANT: override in config.local.yaml
  files:
    udplatency: "curr_udplatency.csv"   # Source for latency + loss
    udpjitter: "curr_udpjitter.csv"     # Source for jitter
    udpcloss: "curr_udpcloss.csv"       # Reference only: outage events, NOT a loss metric

# ------------------------------------------------------------------------------
# COLUMNS - Real headers (verified against the raw files; see data_dictionary.md check 1)
# ------------------------------------------------------------------------------
# Differences versus the FCC dictionary:
# - location_id (listed for udplatency) is NOT in the real file
# - ddate is in all three real files (the dictionary does not list it for latency/jitter)
# - the jitter file uses lowercase 'latency'
columns:
  udplatency: ["unit_id", "dtime", "ddate", "target", "rtt_avg", "rtt_min", "rtt_max", "rtt_std", "successes", "failures"]
  udpjitter: ["unit_id", "dtime", "ddate", "target", "packet_size", "stream_rate", "duration", "packets_up_sent", "packets_down_sent", "packets_up_recv", "packets_down_recv", "jitter_up", "jitter_down", "latency", "successes", "failures"]
  udpcloss: ["unit_id", "dtime", "ddate", "duration", "target", "address", "packets"]

# ------------------------------------------------------------------------------
# TIME - Peak window
# ------------------------------------------------------------------------------
# DECISION D-03 (2026-10-11): dtime is treated as the unit's LOCAL time.
# local_hour = hour(dtime). No offset is added.
# Evidence: the FCC dictionary says UTC, but the hourly RTT profile of Pacific
# units (UTC-7) does not trail the Eastern one (UTC-4) by the 3 h that UTC would
# imply. Correlation at a +3 h shift is about 0 or negative; the best alignment is
# -1 to -2 h, much closer to 0 (local) than to +3 (UTC). See docs/decisions.md.
# The offsets in the unit profile stay verified and documented but are NOT used.
time:
  dtime_format: "%Y-%m-%d %H:%M:%S"
  dtime_is_utc: false
  dtime_interpretation: "local"
  timezone_source: "unit-profile"   # Reference only (offset consistency checks); not used to compute the window
  peak_start_hour: 19            # local hour, inclusive
  peak_end_hour_exclusive: 23    # local hour, exclusive -> window 19:00:00 to 22:59:59
  # Project definition of the evening peak. Citation of the 7-11 pm convention in
  # FCC MBA reports: to be added once verified in the source.
  sensitivity_utc_reading:       # Reported with every result
    enabled: true
    rule: "local_hour = hour(dtime + timezone_offset_dst); expected 4 units at risk with primary_only (vs 5 in the base case), N_MIN applied (step_9.py)"
    timezone_col: "timezone_offset_dst"
    timezone_unit: "hours"

# ------------------------------------------------------------------------------
# SERVER RULE - One test server per unit
# ------------------------------------------------------------------------------
# A unit uses 1 to 4 servers at different distances. The access line is the same
# for all of them, so RTT differences between servers reflect distance and route,
# not the line. Mixing servers inflated risk: with N_MIN applied, 21 units at risk
# with all servers versus 5 with the primary server only (local time, step_9.py).
server_rule:
  mode: "primary_only"   # DECISION D-04 (2026-10-11): confirmed base case
  primary_definition: "target with the most peak-window records for the unit"
  primary_source_file: "udplatency"      # DECISION D-06: primary server comes from the latency file
  apply_to: ["latency", "loss", "jitter"]   # D-06: same server for all three metrics, no own primary for jitter
  tie_break: "alphabetical order of target"
  report_sensitivity_all_servers: true   # Variant A is reported as a sensitivity analysis

# ------------------------------------------------------------------------------
# METRICS - Per unit, peak window only, after the server rule
# ------------------------------------------------------------------------------
# Raw RTT and jitter are in microseconds (duration of the jitter test ~15 s versus the
# documented 10 s, still open). The jitter unit is supported indirectly, not documented.
metrics:
  percentile: 0.95
  percentile_method: "linear"   # pandas quantile default; same as PERCENTILE.INC in Excel/Power BI
  latency:
    source_file: "udplatency"
    source_col: "rtt_avg"
    to_ms_divisor: 1000
    description: "P95 describes the tail where bad QoE lives. The average hides it."
  jitter:
    source_file: "udpjitter"
    source_cols: ["jitter_up", "jitter_down"]
    per_record: "(jitter_up + jitter_down) / 2"
    to_ms_divisor: 1000
    min_peak_records: 50                 # DECISION D-07 (N_MIN_JITTER in the spec): peak jitter records on the primary server
    below_min: "null"                    # p95_jitter_ms stays null and is reported; never 0; latency and loss still scored
  loss:
    source_file: "udplatency"          # NOT curr_udpcloss
    source_cols: ["successes", "failures"]
    formula: "sum(failures) / sum(successes + failures) * 100"
    method: "ratio_of_sums"            # Weights each test by its packets; successes+failures varies by row
    warning: "Do NOT use curr_udpcloss.packets: it is an outage event count, not a percentage"
  descriptive:                           # DECISION D-10: descriptive columns for every analyzed unit; NOT part of risk_flag
    n_days_above_threshold: "distinct dates with at least one peak record where rtt_avg / 1000 > thresholds.base.latency_p95_ms"
    p95_latency_without_worst_day_ms: "P95 of rtt_avg / 1000 after removing all peak records of the date with the most records above the threshold (ties: earliest date); equals p95_latency_ms if no record is above the threshold"
    episodic_label: "p95_latency_without_worst_day_ms <= thresholds.base.latency_p95_ms"   # report wording only; persistent otherwise

# ------------------------------------------------------------------------------
# THRESHOLDS - Risk definition
# ------------------------------------------------------------------------------
# Project-defined operating thresholds, NOT values attributed to a standard.
# Base values mirror docs/metrics_spec.md section 6. They are not chosen to
# reproduce a previous result. Changing them requires a spec change and changelog entry.
# DECISION D-09: jitter stays in the rule although no unit exceeds it (max 4.48 ms in the base case).
thresholds:
  base:
    latency_p95_ms: 20
    jitter_p95_ms: 5
    loss_pct: 1.0
  severe:
    latency_p95_ms: 50
    jitter_p95_ms: 15
    loss_pct: 10
  risk_rule: "risk_flag = 1 if p95_latency_ms > latency_p95_ms OR p95_jitter_ms > jitter_p95_ms OR loss_pct > loss_pct (strictly greater)"
  sensitivity:               # DECISION D-08: units at risk (and % of analyzed) for every combination; reported with every result
    latency_p95_ms: [20, 30, 50]
    jitter_p95_ms: [3, 4, 5]
    loss_pct: [0.05, 0.1, 0.5, 1.0]
    n_min_peak_records: [30, 50, 100]
  # Grid chosen against the per-unit distributions (step_9.py, 237 analyzed units): loss maximum 1.66%,
  # units above 0.05 / 0.1 / 0.5 / 1%: 18 / 10 / 2 / 1; P95 jitter maximum 4.48 ms. The old loss grid
  # {0.5, 1, 2, 5} left most cells empty.

# ------------------------------------------------------------------------------
# DATA QUALITY - No capping, no zero-filling
# ------------------------------------------------------------------------------
# v2.2 hid problems with fillna(0) and clipping at 100%. In v3 invalid records are
# excluded and counted in the log; units with too little data are reported
# separately and are NOT scored.
data_quality:
  no_capping: true
  no_fillna_zero: true
  n_min_peak_records: 50   # Top 5% of 50 records holds at least 2.5 observations; counted AFTER the server rule on latency peak records: 21 units below (237 analyzed) in the base case; 8 units below before the server rule (step_1.py)
  invalid_record_rules:    # Excluded and counted; Step 0 and step_9.py found 0 records for each rule
    - "successes + failures <= 0"
    - "loss_pct outside [0, 100]"
    - "rtt_avg null or negative"
    - "jitter_up or jitter_down null or negative"
    - "dtime not parseable"
  duplicates:
    key: ["unit_id", "dtime", "target"]
    policy: "keep_one_if_identical_else_drop_all"   # Decided after step_4.py: latency 16 rows in 7 groups, all exact; jitter 10 rows, 8 exact and 2 conflicting (unit 943232). Applied in step_9.py: latency 9 exact copies removed; jitter 4 exact copies removed, 2 conflicting rows dropped
  log_file: "data/processed/data_quality_log.csv"

# ------------------------------------------------------------------------------
# OUTPUT - Where processed data goes
# ------------------------------------------------------------------------------
# Power BI consumes ONLY processed data, never raw. Names have no version; the
# version lives in git tags.
output:
  interim_dir: "data/interim/"       # CSV intermediates, gitignored
  processed_dir: "data/processed/"
  unit_metrics_file: "ftth_qoe_unit_metrics.csv"
  insufficient_data_file: "units_insufficient_data.csv"
  variants_file: "variants_matrix.csv"            # 2x2 time reading x server rule (written by pipeline.py)
  sensitivity_file: "sensitivity_grid.csv"         # D-08 grid (written by pipeline.py)
  unit_metrics_columns: ["unit_id", "isp", "state", "census", "download_mbps", "upload_mbps", "whitebox_model", "primary_target", "n_peak_records", "n_peak_jitter_records", "p95_latency_ms", "p95_jitter_ms", "loss_pct", "n_days_above_threshold", "p95_latency_without_worst_day_ms", "flag_latency", "flag_jitter", "flag_loss", "risk_flag", "risk_severe"]   # spec section 9
  reconciliation_doc: "docs/reconciliation.md"